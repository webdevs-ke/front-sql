@if (isObject(data)) {
    <div class="tree-node">
  
      <div class="node-header" (click)="toggle()">
        <span class="arrow">
          {{ expanded ? '▼' : '▶' }}
        </span>
  
        <span class="type">
          {{ isArray(data) ? 'Array' : 'Object' }}
        </span>
  
        <span class="size">
          ({{ keys(data).length }})
        </span>
      </div>
  
      @if (expanded) {
        <div class="node-content">
  
          @for (key of keys(data); track key) {
            <div class="node-entry">
              <span class="key">{{ key }}</span>
              <span class="colon">:</span>
  
              <app-json-tree [data]="data[key]"></app-json-tree>
            </div>
          }
  
        </div>
      }
  
    </div>
  } @else {
    <span class="primitive">
      {{ data }}
    </span>
  }
